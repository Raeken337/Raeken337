<svg
  width="1080"
  height="72"
  viewBox="0 0 1080 72"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="none">

  <defs>
    <!-- Main marine gradient -->
    <linearGradient id="marineWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29465A" stop-opacity="0"/>
      <stop offset="18%" stop-color="#3A5E75" stop-opacity="0.42"/>
      <stop offset="38%" stop-color="#6E8FA3" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#D9E4EC" stop-opacity="0.98"/>
      <stop offset="62%" stop-color="#7EA3B8" stop-opacity="0.72"/>
      <stop offset="82%" stop-color="#3A5E75" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#29465A" stop-opacity="0"/>
    </linearGradient>

    <!-- Secondary deeper-water gradient -->
    <linearGradient id="deepMarineWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1D3140" stop-opacity="0"/>
      <stop offset="25%" stop-color="#2E4B5E" stop-opacity="0.26"/>
      <stop offset="50%" stop-color="#567285" stop-opacity="0.42"/>
      <stop offset="75%" stop-color="#2E4B5E" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#1D3140" stop-opacity="0"/>
    </linearGradient>

    <!-- Moving shimmer -->
    <linearGradient id="shimmerBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#E6F0F7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F8FCFF" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#BDD5E4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <mask id="shimmerMask">
      <rect width="100%" height="100%" fill="black"/>
      <rect x="-240" y="0" width="240" height="72" fill="url(#shimmerBand)">
        <animate attributeName="x" values="-240;1080" dur="8.5s" repeatCount="indefinite"/>
      </rect>
    </mask>

    <filter id="softGlow" x="-20%" y="-120%" width="140%" height="320%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main ripple line -->
  <path
    fill="none"
    stroke="url(#marineWave)"
    stroke-width="2"
    stroke-linecap="round"
    filter="url(#softGlow)"
    d="
      M0 34
      C60 22 120 46 180 34
      C240 22 300 46 360 34
      C420 22 480 46 540 34
      C600 22 660 46 720 34
      C780 22 840 46 900 34
      C960 22 1020 46 1080 34
    ">
    <animate
      attributeName="d"
      dur="8s"
      repeatCount="indefinite"
      values="
        M0 34
        C60 22 120 46 180 34
        C240 22 300 46 360 34
        C420 22 480 46 540 34
        C600 22 660 46 720 34
        C780 22 840 46 900 34
        C960 22 1020 46 1080 34;

        M0 34
        C60 18 120 50 180 33
        C240 26 300 42 360 36
        C420 19 480 49 540 32
        C600 25 660 43 720 35
        C780 17 840 51 900 33
        C960 24 1020 44 1080 34;

        M0 34
        C60 26 120 41 180 35
        C240 17 300 51 360 32
        C420 24 480 43 540 36
        C600 18 660 50 720 33
        C780 25 840 42 900 35
        C960 16 1020 52 1080 34;

        M0 34
        C60 22 120 46 180 34
        C240 22 300 46 360 34
        C420 22 480 46 540 34
        C600 22 660 46 720 34
        C780 22 840 46 900 34
        C960 22 1020 46 1080 34
      "/>
  </path>

  <!-- Soft shimmer overlay on main ripple -->
  <path
    fill="none"
    stroke="#F2F8FC"
    stroke-width="1.35"
    stroke-linecap="round"
    opacity="0.9"
    mask="url(#shimmerMask)"
    filter="url(#softGlow)"
    d="
      M0 34
      C60 22 120 46 180 34
      C240 22 300 46 360 34
      C420 22 480 46 540 34
      C600 22 660 46 720 34
      C780 22 840 46 900 34
      C960 22 1020 46 1080 34
    ">
    <animate
      attributeName="d"
      dur="8s"
      repeatCount="indefinite"
      values="
        M0 34
        C60 22 120 46 180 34
        C240 22 300 46 360 34
        C420 22 480 46 540 34
        C600 22 660 46 720 34
        C780 22 840 46 900 34
        C960 22 1020 46 1080 34;

        M0 34
        C60 18 120 50 180 33
        C240 26 300 42 360 36
        C420 19 480 49 540 32
        C600 25 660 43 720 35
        C780 17 840 51 900 33
        C960 24 1020 44 1080 34;

        M0 34
        C60 26 120 41 180 35
        C240 17 300 51 360 32
        C420 24 480 43 540 36
        C600 18 660 50 720 33
        C780 25 840 42 900 35
        C960 16 1020 52 1080 34;

        M0 34
        C60 22 120 46 180 34
        C240 22 300 46 360 34
        C420 22 480 46 540 34
        C600 22 660 46 720 34
        C780 22 840 46 900 34
        C960 22 1020 46 1080 34
      "/>
  </path>

  <!-- Secondary lower ripple -->
  <path
    fill="none"
    stroke="url(#deepMarineWave)"
    stroke-width="1.2"
    stroke-linecap="round"
    opacity="0.7"
    d="
      M0 44
      C90 36 180 52 270 44
      C360 36 450 52 540 44
      C630 36 720 52 810 44
      C900 36 990 52 1080 44
    ">
    <animate
      attributeName="d"
      dur="11s"
      repeatCount="indefinite"
      values="
        M0 44
        C90 36 180 52 270 44
        C360 36 450 52 540 44
        C630 36 720 52 810 44
        C900 36 990 52 1080 44;

        M0 44
        C90 39 180 49 270 43
        C360 34 450 55 540 45
        C630 38 720 50 810 43
        C900 35 990 53 1080 44;

        M0 44
        C90 34 180 54 270 45
        C360 39 450 49 540 43
        C630 35 720 53 810 45
        C900 38 990 50 1080 44;

        M0 44
        C90 36 180 52 270 44
        C360 36 450 52 540 44
        C630 36 720 52 810 44
        C900 36 990 52 1080 44
      "/>
  </path>
</svg>