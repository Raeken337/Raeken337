<svg width="760" height="64" viewBox="0 0 760 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Base text gradient -->
    <linearGradient id="baseText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E8AAE"/>
      <stop offset="50%" stop-color="#B8B6CC"/>
      <stop offset="100%" stop-color="#8E8AAE"/>
    </linearGradient>

    <!-- Shimmer band gradient -->
    <linearGradient id="shimmerBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="40%" stop-color="#EAE8FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#D9D6F8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <!-- Mask so only the shimmer strip shows -->
    <mask id="shineMask">
      <rect width="100%" height="100%" fill="black"/>
      <rect x="-220" y="0" width="220" height="64" fill="url(#shimmerBand)">
        <animate attributeName="x" values="-220;760" dur="6.5s" repeatCount="indefinite"/>
      </rect>
    </mask>

    <!-- Soft glow -->
    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Tiny drifting motion for the whole line -->
  <g>
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0; 0.8 -0.3; -0.6 0.4; 0.4 -0.2; 0 0"
      dur="7.5s"
      repeatCount="indefinite"/>

    <!-- Base text: always visible -->
    <text
      x="380"
      y="38"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="16"
      font-style="italic"
      letter-spacing="0.2px"
      fill="url(#baseText)"
      opacity="0.96">
      Building intelligent systems somewhere between security and the moonlight.
    </text>

    <!-- Shimmer overlay -->
    <text
      x="380"
      y="38"
      text-anchor="middle"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="16"
      font-style="italic"
      letter-spacing="0.2px"
      fill="#F6F4FF"
      opacity="0.95"
      mask="url(#shineMask)"
      filter="url(#softGlow)">
      Building intelligent systems somewhere between security and the moonlight.
    </text>
  </g>
</svg>
